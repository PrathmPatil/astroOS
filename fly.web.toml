# fly.toml app configuration file generated for AstroOS Web
# See https://fly.io/docs/reference/configuration/

app = "astroos-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.web"
  [build.args]
    NEXT_PUBLIC_API_URL = "https://astroos-api.fly.dev/api/v1"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
