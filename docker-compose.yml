services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astrosutra
      POSTGRES_PASSWORD: astrosutra
      POSTGRES_DB: astrosutra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrosutra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://astrosutra:astrosutra@postgres:5432/astrosutra
      REDIS_URL: redis://redis:6379/0
      SE_EPHE_PATH: /app/ephe
    volumes:
      - ./backend:/app
      - ./backend/ephe:/app/ephe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://astrosutra:astrosutra@postgres:5432/astrosutra
      REDIS_URL: redis://redis:6379/0
      SE_EPHE_PATH: /app/ephe
    volumes:
      - ./backend:/app
      - ./backend/ephe:/app/ephe
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
