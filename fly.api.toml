# fly.toml app configuration file generated for AstroOS API
# See https://fly.io/docs/reference/configuration/

app = "astroos-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.api"

[env]
  APP_ENV = "production"
  DEBUG = "false"
  AI_PROVIDER = "none"
  ASTROOS_ROOT = "/app"
  SE_EPHE_PATH = "/app/ephe"
  # Update after web app is live (comma-separated)
  CORS_ORIGINS = "https://astroos-web.fly.dev,http://localhost:3000,http://localhost:3001"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
